    // ==================== FUNGSI PARSING ====================
    function cleanNominalToPlainNumber(raw) {
        if (!raw) return 0;
        let cleaned = String(raw).replace(/\./g, '').replace(/,/g, '');
        let match = cleaned.match(/\d+/);
        let num = match ? parseInt(match[0], 10) : 0;
        return isNaN(num) ? 0 : num;
    }

    // ========== FUNGSI PARSER SHORTCUT KLIK BCA ==========
    function parseShortcutFormat(lines) {
        let results = [];
        let i = 0;
        
        while (i < lines.length) {
            let line = lines[i].trim();
            
            if (line === 'PEND') {
                let nextLine = i + 1 < lines.length ? lines[i + 1].trim() : '';
                if (nextLine.includes('TRSF E-BANKING CR') || nextLine.includes('TRSF E-BANKING DB')) {
                    let crdb = 'cr';
                    if (nextLine.includes('DB')) crdb = 'db';
                    
                    let nama = i + 4 < lines.length ? lines[i + 4].trim() : '';
                    let nominalRaw = i + 6 < lines.length ? lines[i + 6].trim() : '';
                    let nominalFormatted = nominalRaw.replace(/\.00$/, '');
                    let nominalNumber = cleanNominalToPlainNumber(nominalRaw);
                    
                    if (nama && nominalNumber > 0) {
                        results.push({ 
                            crdb: crdb, 
                            nama: nama, 
                            nominalNumber: nominalNumber,
                            nominalFormatted: nominalFormatted
                        });
                    }
                    i += 9;
                    continue;
                }
            }
            i++;
        }
        return results;
    }

    // ========== FUNGSI PARSER SHORTCUT MY BCA (DIPERBAIKI) ==========
    function parseShortcutBCAFormat(lines) {
        let results = [];
        
        for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();
            if (!line) continue;
            
            // Deteksi pola: "TRSF E-BANKING DB - 2408/FTSCY/WS95271 17300000.00 AHMAD RIVALDI"
            let match = line.match(/TRSF E-BANKING (CR|DB)\s*-\s*[^\s]+\s+([\d,.]+)\s+(.+?)(?:\t|$)/);
            if (match) {
                let crdb = match[1].toLowerCase(); // "cr" atau "db"
                let nominalRaw = match[2]; // "17300000.00" atau "50,000.00"
                let nama = match[3].trim(); // "AHMAD RIVALDI"
                
                // Bersihkan nama dari IDR dan angka di belakang
                nama = nama.replace(/IDR\s+[\d,.]+.*$/, '').trim();
                
                // Ambil nominal dari IDR jika ada (lebih akurat)
                let idrMatch = line.match(/IDR\s+([\d,.]+)/);
                if (idrMatch) {
                    nominalRaw = idrMatch[1];
                }
                
                let nominalFormatted = nominalRaw.replace(/\.00$/, '');
                let nominalNumber = cleanNominalToPlainNumber(nominalRaw);
                
                if (nama && nominalNumber > 0) {
                    results.push({ 
                        crdb: crdb, 
                        nama: nama, 
                        nominalNumber: nominalNumber,
                        nominalFormatted: nominalFormatted
                    });
                }
                continue;
            }
            
            // Fallback: coba pola lain jika format berbeda
            let fallbackMatch = line.match(/(CR|DB)\s*-\s*[^\s]+\s+([\d,.]+)\s+([A-Za-z\s]+)/i);
            if (fallbackMatch) {
                let crdb = fallbackMatch[1].toLowerCase();
                let nominalRaw = fallbackMatch[2];
                let nama = fallbackMatch[3].trim();
                
                let idrMatch = line.match(/IDR\s+([\d,.]+)/);
                if (idrMatch) {
                    nominalRaw = idrMatch[1];
                }
                
                let nominalFormatted = nominalRaw.replace(/\.00$/, '');
                let nominalNumber = cleanNominalToPlainNumber(nominalRaw);
                
                if (nama && nominalNumber > 0) {
                    results.push({ 
                        crdb: crdb, 
                        nama: nama, 
                        nominalNumber: nominalNumber,
                        nominalFormatted: nominalFormatted
                    });
                }
            }
        }
        
        return results;
    }

    function parseFailedV2Format(text) {
        let results = [];
        let refNoMatch = text.match(/Reference No\.\s+([^\n]+)/);
        let refNo = refNoMatch ? refNoMatch[1].trim() : '';
        let statusMatch = text.match(/Status\s+([^\n]+)/);
        let status = statusMatch ? statusMatch[1].trim() : '';
        if (status !== 'failed') return results;
        let amountMatch = text.match(/Amount\s+Rp([\d,]+)/);
        let nominalRaw = amountMatch ? amountMatch[1] : '';
        let nominalNumber = nominalRaw ? -parseInt(cleanNominalToPlainNumber(nominalRaw)) : 0;
        let bankMatch = text.match(/Bank\s+([^\n]+)/);
        let bank = bankMatch ? bankMatch[1].trim() : '';
        let accNumMatch = text.match(/Account Number\s+([^\n]+)/);
        let accountNumber = accNumMatch ? accNumMatch[1].trim() : '';
        let namaMatch = text.match(/Account Holder Name\s+([^\n]+)/);
        let nama = namaMatch ? namaMatch[1].trim() : '';
        let remarkMatch = text.match(/Remark\s+([^\n]+)/);
        let remark = remarkMatch ? remarkMatch[1].trim() : '';
        let remarkFirst = remark.split('||')[0] || '';
        if (bank && refNo && accountNumber) {
            results.push({
                bank, remark: remarkFirst, refNo, norek: accountNumber, nama,
                nominalNumber, nominalPreview: `(${Math.abs(nominalNumber).toLocaleString('id-ID')})`
            });
        }
        return results;
    }

    function isFailedV2Format(text) {
        return text.includes('Reference No.') && text.includes('Transaction Detail:') && text.includes('Status\tfailed');
    }

    function parseWithdrawFormat(lines) {
        if (lines.length < 4) return null;
        let line1 = lines[0]?.trim() || '';
        let userId = line1.split(/\t/).pop() || line1;
        let line2 = lines[1]?.trim() || '';
        let nominalRaw = '';
        let parts2 = line2.split(/\t/);
        if (parts2.length >= 3) nominalRaw = parts2[2];
        else { let match = line2.match(/Withdraw.*?\t(\d+[\d,]*)/); if (match) nominalRaw = match[1]; }
        let line4 = lines[3]?.trim() || '';
        let bankParts = line4.split(',').map(p => p.trim());
        let bank = (bankParts[0] || '').toUpperCase();
        let norek = bankParts[1] || '';
        let nama = bankParts[2] || '';
        if (bank === 'IANDIRI') bank = 'MANDIRI';
        if (bank === 'LINK AJA') bank = 'LINKAJA';
        let nominalNumber = cleanNominalToPlainNumber(nominalRaw);
        return {
            bank: bank, 
            norek: norek, 
            userId, 
            nama,
            nominalPreview: nominalNumber.toLocaleString('id-ID'),
            nominalNumber: nominalNumber
        };
    }

    function parseFailedFormat(line) {
        let parts = line.split('\t');
        if (parts.length < 8) return null;
        let userId = parts[3]?.trim() || '';
        let bankRaw = parts[4]?.trim() || '';
        let norek = parts[5]?.trim() || '';
        let nama = parts[6]?.trim() || '';
        let nominalRaw = parts[7]?.trim() || '';
        if (bankRaw.toLowerCase().startsWith('bank ')) bankRaw = bankRaw.substring(5).trim();
        bankRaw = bankRaw.toUpperCase();
        if (bankRaw === 'LINK AJA') bankRaw = 'LINKAJA';
        let nominalNumber = parseInt(cleanNominalToPlainNumber(nominalRaw)) || 0;
        return {
            bank: bankRaw, 
            norek: norek, 
            userId, 
            nama,
            nominalPreview: `(${nominalNumber.toLocaleString('id-ID')})`,
            nominalNumber: -nominalNumber
        };
    }

    function parsePendingFormat(line) {
        let parts = line.split('\t');
        if (parts.length < 8) return null;
        let tanggal = parts[0]?.trim() || '';
        let userId = parts[3]?.trim() || '';
        let nominal1Raw = parts[7]?.trim() || '';
        let nominal2Raw = parts[8]?.trim() || '';
        let nominal1Number = parseInt(cleanNominalToPlainNumber(nominal1Raw)) || 0;
        let nominal2Number = parseInt(cleanNominalToPlainNumber(nominal2Raw)) || 0;
        return {
            tanggal, 
            userId,
            nominal1Preview: nominal1Number.toLocaleString('id-ID'), 
            nominal1Number,
            nominal2Preview: nominal2Number.toLocaleString('id-ID'), 
            nominal2Number
        };
    }

    function parseNominalDanaCancelToNumber(rawNominal) {
        if (!rawNominal) return 0;
        let cleaned = String(rawNominal).replace(/Rp\s*/gi, '').trim();
        let numberValue = parseInt(cleaned.replace(/\./g, '').replace(/,/g, ''), 10);
        if (isNaN(numberValue)) numberValue = 0;
        return numberValue;
    }

    function extractSenderName(text) {
        if (!text) return '';
        let danaMatch = text.match(/telah diterima dari\s+([A-Za-z\s]+?)(?:\s+with|$|\n)/i);
        if (danaMatch) return danaMatch[1].trim();
        let danaMatch2 = text.match(/dari\s+([A-Za-z\s]+?)(?:\s+dengan|$|\n|💰)/i);
        if (danaMatch2 && danaMatch2[1].length < 50) return danaMatch2[1].trim();
        let bcaMatch = text.match(/TRANSFER DR\s+\d+\s+([A-Za-z\s]+?)(?:\s+PR|\s+\d|$)/i);
        if (bcaMatch) return bcaMatch[1].trim();
        let bcaMatch2 = text.match(/CR\s+TRANSFER\s+DR\s+\d+\s+([A-Za-z\s]+?)(?:\s+PR|\s+\d|$)/i);
        if (bcaMatch2) return bcaMatch2[1].trim();
        let briMatch = text.match(/Transfer dari\s+([^\n]+?)(?:\s+via|\s+waiting|$)/i);
        if (briMatch) return briMatch[1].trim();
        if (text.length < 50 && !text.includes('via') && !text.includes('TRSF') && !text.includes('BI-FAST')) return text.trim();
        return '';
    }

    function parseDanaCancelFormat(raw) {
        let results = [];
        let lines = raw.split(/\r?\n/);
        let i = 0;
        while (i < lines.length) {
            let line = lines[i].trim();
            let recordMatch = line.match(/^(\d+)$/);
            if (recordMatch && i + 12 < lines.length) {
                let line2 = lines[i+2]?.trim() || '';
                let line5 = lines[i+5]?.trim() || '';
                let line7 = lines[i+7]?.trim() || '';
                let line11 = lines[i+11]?.trim() || '';
                let depoInfo = line2;
                let nominalRaw = '';
                if (line7 && line7.includes('Rp')) nominalRaw = line7.replace('Rp', '').trim();
                else if (line5) nominalRaw = line5;
                let nominalValue = parseNominalDanaCancelToNumber(nominalRaw);
                let senderName = extractSenderName(line11);
                if (senderName && nominalValue > 0 && depoInfo) {
                    results.push({ senderName: senderName, nominal: nominalValue, depoInfo: depoInfo });
                }
                i += 14;
                continue;
            }
            let quotePattern = /(\d+)\t([^\n]+)\n"([^"]+)"\t"([^"]+)"\t"([^"]+)"\t"([^"]+)"/;
            let match = raw.substring(i).match(quotePattern);
            if (match && match.index === 0) {
                let depoInfo = match[2].trim();
                let col4 = match[4];
                let col6 = match[6];
                let nominalLines = col4.split('\n');
                let nominalRaw = nominalLines[0]?.trim() || '';
                let nominalValue = parseNominalDanaCancelToNumber(nominalRaw);
                let senderName = extractSenderName(col6);
                if (senderName && nominalValue > 0) {
                    results.push({ senderName: senderName, nominal: nominalValue, depoInfo: depoInfo });
                }
                i += match[0].length;
                continue;
            }
            i++;
        }
        return results;
    }

    function parseQRISTOWDFormat(lines) {
        let results = [];
        for (let line of lines) {
            line = line.trim();
            if (!line) continue;
            let parts = line.split('\t');
            if (parts.length < 7) continue;
            let bank = parts[0]?.trim() || '';
            let userId = parts[1]?.trim() || '';
            let norek = parts[3]?.trim() || '';
            let nama = parts[4]?.trim() || '';
            let nominalRaw = parts[6]?.trim() || '';
            if (bank) bank = 'QRIS - ' + bank;
            let nominalClean = nominalRaw.replace(/[()]/g, '').replace(/,/g, '');
            let nominalNumber = parseInt(nominalClean) || 0;
            let nominalPositive = Math.abs(nominalNumber);
            if (bank && norek && userId && nama && nominalPositive > 0) {
                results.push({
                    bank: bank,
                    norek: norek,
                    userId: userId,
                    nama: nama,
                    nominalNumber: nominalPositive,
                    nominalPreview: nominalPositive.toLocaleString('id-ID')
                });
            }
        }
        return results;
    }

    function parseShortcutFollowUp(lines) {
        let results = [];
        for (let line of lines) {
            line = line.trim();
            if (!line) continue;
            let parts = line.split('\t');
            if (parts.length < 4) continue;
            let nama = parts[0]?.trim() || '';
            let norek = parts[1]?.trim() || '';
            let keterangan = parts[2]?.trim() || '';
            let saldoRaw = parts[3]?.trim() || '';
            let jenisBank = parts[4]?.trim() || '';
            let saldoClean = saldoRaw.replace(/Rp/gi, '').replace(/\./g, '').replace(/,/g, '');
            let saldoNumber = parseInt(saldoClean) || 0;
            if (nama && norek) {
                results.push({
                    nama: nama,
                    norek: norek,
                    keterangan: keterangan,
                    saldoRaw: saldoRaw,
                    saldoNumber: saldoNumber,
                    jenisBank: jenisBank
                });
            }
        }
        return results;
    }

    function parseShortcutFailedXPay(lines) {
        let results = [];
        let i = 0;
        while (i < lines.length) {
            let line = lines[i].trim();
            let numberMatch = line.match(/^(\d+)\.$/);
            if (numberMatch && i + 12 < lines.length) {
                let nominalRaw = lines[i+2]?.trim() || '';
                let bank = lines[i+4]?.trim() || '';
                let norek1 = lines[i+5]?.trim() || '';
                let norek2 = lines[i+6]?.trim() || '';
                let nama = lines[i+7]?.trim() || '';
                let litId = lines[i+8]?.trim() || '';
                let rekening = norek1 || norek2 || '';
                let nominalClean = nominalRaw.replace(/\./g, '').replace(/,/g, '');
                let nominalNumber = parseInt(nominalClean) || 0;
                let nominalFormatted = -nominalNumber;
                if (bank && litId && rekening && nama) {
                    results.push({
                        bank: bank,
                        username: '',
                        litId: litId,
                        norek: rekening,
                        nama: nama,
                        nominalNumber: nominalFormatted,
                        nominalPreview: nominalFormatted
                    });
                }
                i += 13;
                continue;
            }
            i++;
        }
        return results;
    }

    function parseShortcutPendingXPay(lines) {
        let results = [];
        let i = 0;
        while (i < lines.length) {
            let line = lines[i].trim();
            let numberMatch = line.match(/^(\d+)\.$/);
            if (numberMatch && i + 8 < lines.length) {
                let nominalRaw = lines[i+2]?.trim() || '';
                let litId = lines[i+6]?.trim() || '';
                let timestamp = lines[i+8]?.trim() || '';
                let formattedDate = timestamp.replace(/-/g, '/');
                let nominalClean = nominalRaw.replace(/\./g, '').replace(/,/g, '');
                let nominalNumber = parseInt(nominalClean) || 0;
                if (litId && timestamp) {
                    results.push({
                        tanggal: formattedDate,
                        litId: litId,
                        nominalNumber: nominalNumber
                    });
                }
                i += 9;
                continue;
            }
            i++;
        }
        return results;
    }

    // ========== PARSER UTAMA ==========
    function parseDataForTab(raw, tabId) {
        let lines = raw.split(/\r?\n/);
        
        if (tabId === 'shortcutbca') {
            return parseShortcutBCAFormat(lines);
        }
        
        if (tabId === 'failedv2' && isFailedV2Format(raw)) {
            return parseFailedV2Format(raw);
        }
        
        if (tabId === 'shortcut') {
            let isShortcut = false;
            for (let i = 0; i < Math.min(lines.length, 10); i++) {
                let line = lines[i].trim();
                if (line === 'PEND' && i+1 < lines.length && lines[i+1].includes('TRSF E-BANKING')) {
                    isShortcut = true;
                    break;
                }
            }
            if (isShortcut) return parseShortcutFormat(lines);
            return [];
        }
        
        if (tabId === 'danacancel') {
            return parseDanaCancelFormat(raw);
        }
        
        if (tabId === 'qristowd') {
            return parseQRISTOWDFormat(lines);
        }
        
        if (tabId === 'shortcutfollowup') {
            return parseShortcutFollowUp(lines);
        }
        
        if (tabId === 'shortcutfailedxpay') {
            return parseShortcutFailedXPay(lines);
        }
        
        if (tabId === 'shortcutpendingxpay') {
            return parseShortcutPendingXPay(lines);
        }
        
        let results = [];
        for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();
            if (!line) continue;
            if (line.includes('pending') && tabId === 'pending') {
                let data = parsePendingFormat(line);
                if (data) results.push(data);
            }
            else if (line.includes('failed') && tabId === 'failed') {
                let data = parseFailedFormat(line);
                if (data) results.push(data);
            }
            else if (line.includes('Withdraw') && tabId === 'legacy') {
                let prevLine = i > 0 ? lines[i-1].trim() : '';
                let nextLine1 = i+1 < lines.length ? lines[i+1].trim() : '';
                let nextLine2 = i+2 < lines.length ? lines[i+2].trim() : '';
                let data = parseWithdrawFormat([prevLine, line, nextLine1, nextLine2]);
                if (data) results.push(data);
                i += 2;
            }
        }
        
        if (tabId === 'failed' || tabId === 'pending') {
            results.reverse();
        }
        
        return results;
    }

    function updateAll() {
        let raw = tabData[currentTab] || '';
        let data = parseDataForTab(raw, currentTab);
        renderTable(data);
        document.getElementById('statsPanel').innerHTML = `📊 TOTAL: ${data.length} TRANSAKSI | ${tabConfig[currentTab].title}`;
    }

    async function copyOutput() {
        let raw = tabData[currentTab] || '';
        if (!raw.trim()) { alert('⚠️ TIDAK ADA DATA!'); return; }
        let data = parseDataForTab(raw, currentTab);
        let text = getOutputText(data);
        if (!text) { alert('⚠️ TIDAK ADA DATA YANG BISA DI COPY!'); return; }
        await navigator.clipboard.writeText(text);
        let notif = document.createElement('div');
        notif.className = 'copy-success';
        notif.innerText = `✓ COPY ${tabConfig[currentTab].title}`;
        document.body.appendChild(notif);
        setTimeout(() => notif.remove(), 2000);
    }

    function escapeHtml(str) { return String(str || '').replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }

        let textarea = document.getElementById('inputData');

        const config = tabConfig[tabId];
        document.getElementById('headerTitle').innerHTML = config.title;
        document.getElementById('headerSubtitle').innerHTML = config.subtitle;
        document.body.style.backgroundImage = tabWallpapers[tabId];
        document.body.style.backgroundRepeat = "no-repeat";
        document.body.style.backgroundSize = "cover";
        document.body.style.backgroundPosition = "center center";
        document.body.style.backgroundAttachment = "fixed";
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.tab === tabId);
        });
        loadTabData();
    }

    // ========== EVENT LISTENERS ==========
    document.getElementById('inputData').addEventListener('input', () => {
        saveCurrentInput();
        updateAll();
    });
    
    document.getElementById('clearInputBtn').addEventListener('click', () => {
        document.getElementById('inputData').value = '';
        saveCurrentInput();
        updateAll();
    });
    
    document.getElementById('copyOutputBtn').addEventListener('click', copyOutput);
    
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    // ========== INISIALISASI ==========
    document.body.style.backgroundImage = tabWallpapers.legacy;
    document.body.style.backgroundRepeat = "no-repeat";
    document.body.style.backgroundSize = "cover";
    document.body.style.backgroundPosition = "center center";
    document.body.style.backgroundAttachment = "fixed";
    
    loadTabData();
</script>
</body>
</html>
